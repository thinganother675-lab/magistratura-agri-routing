[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "agro-route-lab"
version = "0.1.0"
description = "Reproducible local/cloud agricultural routing research harness"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Antoniy Sarychev"}, {name = "Denis Shesternin"}]
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<0.29", "numpy>=2,<3", "scipy>=1.14,<2", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
agro-route = "agro_route.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agro_route = ["static/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
